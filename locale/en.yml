# v0.2.0i.h: 顶层加 ziiven-bjxy-website: 包裹 (SOP 230)
#   根因: vendor Frontend/AddTranslations.php L30-32 filter regex
#     preg_match('/^.+(?:\.|::)(?:admin|lib|forum)\./', $id)
#   要求 key 含 namespace (e.g. 'ziven-dress-up.admin.permissions.allow_use')
#   之前 bjxy yml 顶层没 namespace 包裹, key 是 'admin.home_page_option' (regex 不匹配, filter 排除)
#   → 翻译 key 不进 admin-zh-Hans.js bundle, admin app translator.translations 找不到 key
#   v0.2.0i.h.a 第一次修只 wrap 了 'extension:' (8d08e69), 错修
#     forum:/admin:/bookings: 还是顶层平级, yml 多 root key, 实际 parse 失败
#   v0.2.0i.h.b 整 yml 顶层 wrap 'ziiven-bjxy-website:' (这文件)
#     所有 key 变成 'ziiven-bjxy-website.{forum|admin|extension}.*' 形式
#     setSetting trans() 调 'ziiven-bjxy-website.admin.home_page_option'
ziiven-bjxy-website:
  extension:
    name: Bjxy Website
    title: 北极雪屿官网
    description: 滑雪培训官网 (Flarum 2.0 page extension)

  forum:
    # v0.2.0 (辉哥 2026-08-09 8:14 反馈): 预约体验 modal translation
    booking_modal:
      title: Book Trial Experience
      field_name: Name
      field_phone: Phone
      field_age: Age (optional)
      field_has_ski_experience: Has Ski Experience
      field_experience_type: Experience Type
      field_booking_date: Booking Date
      yes: Yes
      no: No
      type_single: Single Board
      type_double: Double Board
      submit: Submit
      submitting: Submitting...
      cancel: Cancel
      close: Close
      success: Booking submitted, our staff will contact you soon
      error_required: Required field is empty

  admin:
    settings:
      title: 北极雪屿官网配置
      brand: 品牌信息
      hero: Hero 区域
      about: 关于我们
      features: 办学特色
      curriculum: 教学体系
      coaches: 教练展示
      contact: 联系方式
      reviews: 学员评价
      students: 学员展示
      save: 保存
      saved: 已保存
      upload_logo: 上传 Logo
      upload_banner: 上传 Banner
      upload_avatar: 上传图片
    # v0.2.0i.h (辉哥 2026-08-11 21:43 反馈): admin 论坛首页 radio 新增 /bjxy 选项 label
    #   vendor BasicsPage.homePageItems() 初始只 add allDiscussions
    #   js/src/admin/index.js 走 app.beforeMount + setSetting 注入这个选项
    #   Flarum 论坛首页 setting = default_route, 选 /bjxy 后 / 走 bjxy route handler
    home_page_option: bjxy 官网
    # v0.2.0: Bookings list translation
    bookings:
      title: Bookings
      empty: No bookings yet
      col_id: ID
      col_name: Name
      col_phone: Phone
      col_age: Age
      col_has_ski_experience: Has Experience
      col_experience_type: Experience Type
      col_booking_date: Booking Date
      col_created_at: Submitted At
